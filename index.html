<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mis cosas — Brisbane</title>
<style>
  :root{
    --bg: #F5F6F1;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --ink-soft: #5B665D;
    --line: #DCDFD5;
    --river: #2E6E6E;
    --river-soft: #E4EEEC;
    --jacaranda: #7C6A9C;
    --jacaranda-soft: #EFEBF4;
    --rust: #B5542D;
    --rust-soft: #F6E7E0;
    --amber: #A8790F;
    --amber-soft: #F5EEDD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:22px;}
  h1{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.92rem;}

  .add-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:24px;
  }
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .add-row:last-child{margin-bottom:0;}
  input, select{
    font-family:inherit;
    font-size:0.92rem;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#FAFAF7;
    color:var(--ink);
  }
  input[name="titulo"]{flex:1 1 220px;}
  input[type="date"]{flex:0 0 150px;}
  select{flex:0 0 150px;}
  input[name="notas"]{flex:1 1 100%;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:8px 14px;
    font-size:0.88rem;
    font-weight:600;
  }
  .btn-add{background:var(--river);color:white;flex:0 0 auto;}
  .btn-add:hover{background:#255a5a;}

  .group{margin-bottom:22px;}
  .group h2{
    font-size:0.78rem;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .task.done{opacity:0.55;}
  .task.done .t-title{text-decoration:line-through;}
  .check{
    margin-top:2px;
    width:18px;height:18px;
    accent-color:var(--river);
    flex:0 0 auto;
    cursor:pointer;
  }
  .t-body{flex:1;min-width:0;}
  .t-title{font-size:0.95rem;font-weight:600;margin:0;}
  .t-notes{font-size:0.83rem;color:var(--ink-soft);margin:2px 0 0;}
  .t-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .badge{
    font-size:0.72rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
  }
  .b-cat{background:var(--jacaranda-soft);color:var(--jacaranda);}
  .b-due-ok{background:var(--river-soft);color:var(--river);}
  .b-due-soon{background:var(--amber-soft);color:var(--amber);}
  .b-due-over{background:var(--rust-soft);color:var(--rust);}
  .del{background:transparent;color:var(--ink-soft);font-size:1rem;padding:2px 6px;flex:0 0 auto;}
  .del:hover{color:var(--rust);}
  .empty{color:var(--ink-soft);font-size:0.9rem;padding:16px 0;text-align:center;}
  .status{font-size:0.78rem;color:var(--ink-soft);text-align:center;margin-top:18px;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border:none;border-radius:0;padding:9px 4px;margin-right:14px;font-size:0.92rem;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .tab.active{color:var(--river);border-bottom:2px solid var(--river);}

  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  @media(max-width:480px){ .service-grid{grid-template-columns:1fr;} }
  .s-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;position:relative;}
  .s-type{display:inline-block;font-size:0.68rem;font-weight:700;color:var(--jacaranda);background:var(--jacaranda-soft);padding:2px 8px;border-radius:20px;margin-bottom:6px;}
  .s-nombre{font-size:0.98rem;font-weight:700;margin:0 0 1px;}
  .s-proveedor{font-size:0.85rem;color:var(--ink-soft);margin:0 0 6px;}
  .s-ref{font-size:0.85rem;font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;background:#FAFAF7;border:1px solid var(--line);border-radius:6px;padding:4px 7px;display:inline-block;margin-bottom:4px;}
  .s-notas{font-size:0.8rem;color:var(--ink-soft);margin:4px 0 0;white-space:pre-line;}
  .s-edit{position:absolute;top:8px;right:8px;background:transparent;color:var(--river);font-size:0.76rem;font-weight:700;padding:2px 5px;}
  .s-edit:hover{text-decoration:underline;}
  .s-editing{display:flex;flex-direction:column;gap:6px;}
  .s-editing input, .s-editing select{width:100%;font-size:0.85rem;padding:6px 8px;}
  .s-edit-actions{display:flex;gap:6px;margin-top:2px;}
  .s-edit-actions .btn-add{flex:1;padding:6px 10px;font-size:0.82rem;}
  .btn-cancel{background:transparent;color:var(--ink-soft);border:1px solid var(--line);flex:1;padding:6px 10px;font-size:0.82rem;}
  .s-pdf{display:block;margin-top:8px;background:var(--river-soft);color:var(--river);font-size:0.78rem;font-weight:700;padding:6px 10px;border-radius:7px;width:100%;}
  .s-pdf:hover{background:var(--river);color:white;}
  .sugg-title{font-size:0.78rem;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}

  .lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;}
  .lock-box{max-width:340px;width:100%;text-align:center;}
  .lock-box h1{margin-bottom:6px;}
  .lock-box p{color:var(--ink-soft);font-size:0.9rem;margin:0 0 18px;}
  .lock-box input{width:100%;margin-bottom:10px;text-align:center;}
  .lock-box .btn-add{width:100%;}
  .lock-error{color:var(--rust);font-size:0.82rem;margin-top:10px;min-height:1em;}
  .lock-link{font-size:0.85rem;margin-top:10px;}
  .lock-link a{color:var(--river);cursor:pointer;text-decoration:underline;}
  .recovery-code{font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;font-size:1.15rem;font-weight:700;background:#FAFAF7;border:1px solid var(--line);border-radius:8px;padding:14px;letter-spacing:1px;word-break:break-all;margin-bottom:14px;}
  .footer-link{text-align:center;margin-top:6px;}
  .footer-link a{font-size:0.78rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
</style>

<script>

const db = firebase.firestore();
const COLLECTION = 'misCosas'; // no cambies esto salvo que sepas lo que haces

async function fsGet(docName){
  const snap = await db.collection(COLLECTION).doc(docName).get();
  return snap.exists ? snap.data() : null;
}
async function fsSet(docName, data){
  await db.collection(COLLECTION).doc(docName).set(data);
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

/* ================== CIFRADO Y CONTRASEÑA DE PERFIL ==================
   Los textos sensibles (nombres, referencias, notas, el PDF) se cifran en
   el navegador con AES-GCM usando una "clave de datos" (DEK) aleatoria.
   Esa DEK se guarda envuelta (cifrada) de DOS formas distintas en Firestore:
   una con una clave derivada de tu contraseña (PBKDF2), y otra con una clave
   derivada de un código de recuperación que solo tú guardas. Así puedes
   cambiar la contraseña sin re-cifrar tus datos, y recuperarlos si la
   olvidas, sin que la contraseña ni el código se guarden nunca en ningún
   sitio — ni en Firestore, ni en el código, ni fuera de tu cabeza. */
let cryptoKey = null;
let lockMode = 'checking';
let pendingDekBytes = null; // DEK sin envolver, mientras se pide una contraseña nueva tras recuperar

function b64FromBytes(bytes){ let s=''; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function bytesFromB64(b64){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr; }

async function deriveKey(secret, saltB64){
  const salt = bytesFromB64(saltB64);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
async function wrapBytes(key, rawBytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const buf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, rawBytes);
  const out = new Uint8Array(iv.length + buf.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(buf), iv.length);
  return b64FromBytes(out);
}
async function unwrapBytes(key, payload){
  const bytes = bytesFromB64(payload);
  const iv = bytes.slice(0,12), data = bytes.slice(12);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return new Uint8Array(buf);
}
async function encStr(key, text){ return wrapBytes(key, new TextEncoder().encode(text || '')); }
async function decStr(key, payload){
  if(!payload) return '';
  return new TextDecoder().decode(await unwrapBytes(key, payload));
}
async function importDek(dekBytes){
  return crypto.subtle.importKey('raw', dekBytes, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
}
function generateRecoveryCode(){
  const alphabet = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // sin 0,1,I,L,O para evitar confusiones al escribirlo
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  let code = '';
  for(let i=0;i<16;i++){
    code += alphabet[bytes[i] % alphabet.length];
    if(i % 4 === 3 && i !== 15) code += '-';
  }
  return code;
}
function normalizeCode(s){ return s.trim().toUpperCase().replace(/\s+/g,''); }

function showLockError(msg){ document.getElementById('lock-error').textContent = msg; }

async function initLock(){
  let profile = null;
  try{ profile = await fsGet('profile'); }catch(e){}
  if(profile && (profile.v === 2 || (profile.salt && profile.check))){
    showUnlockUI();
  } else {
    showSetupUI();
  }
}

function showUnlockUI(){
  lockMode = 'unlock';
  document.getElementById('lock-msg').textContent = 'Introduce tu contraseña para continuar.';
  document.getElementById('lock-pass').value = '';
  document.getElementById('lock-pass').placeholder = 'Contraseña';
  document.getElementById('lock-pass2').style.display = 'none';
  document.getElementById('lock-forgot').style.display = '';
  document.getElementById('lock-back').style.display = 'none';
  document.getElementById('lock-form').style.display = '';
  document.getElementById('lock-recovery-display').style.display = 'none';
  document.getElementById('lock-btn').textContent = 'Entrar';

}
function showSetupUI(){
  lockMode = 'setup';
  document.getElementById('lock-msg').textContent = 'Primera vez: crea una contraseña para proteger tus datos.';
  document.getElementById('lock-pass').value = '';

  document.getElementById('lock-pass2').style.display = '';
  document.getElementById('lock-pass2').value = '';

function showRecoveryScreen(code){
  lockMode = 'showcode';
  document.getElementById('lock-msg').textContent = 'Guarda este código en un lugar seguro (gestor de contraseñas, papel...). Es la ÚNICA forma de recuperar tus datos si olvidas la contraseña, y no se volverá a mostrar.';
  document.getElementById('lock-form').style.display = 'none';
  document.getElementById('recovery-code-text').textContent = code;
  document.getElementById('lock-recovery-display').style.display = '';

}
function confirmRecoverySaved(){
  document.getElementById('lock-recovery-display').style.display = 'none';
  document.getElementById('lock-form').style.display = '';
  unlockApp();
}
function copyRecoveryCode(){
  const code = document.getElementById('recovery-code-text').textContent;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>alert('Código copiado.')).catch(()=>alert('No se pudo copiar. Cópialo a mano.'));
  } else {
    alert('No se pudo copiar automáticamente. Cópialo a mano.');
  }
}
function emailRecoveryCode(){
  const code = document.getElementById('recovery-code-text').textContent;
  let email = localStorage.getItem('miEmailParaCodigo') || '';
  if(!email){
    email = prompt('¿A qué email quieres enviarte el código? (solo abre tu app de correo; no se guarda en la base de datos)') || '';
    if(email) localStorage.setItem('miEmailParaCodigo', email);
  }
  if(!email) return;
  const subject = encodeURIComponent('Código de recuperación — Mis cosas Brisbane');
  const body = encodeURIComponent('Guarda este código en un lugar seguro. Es la única forma de recuperar tus datos si olvidas la contraseña:\n\n' + code);
  window.location.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + subject + '&body=' + body;
}

async function handleLockSubmit(){
  const pass = document.getElementById('lock-pass').value;
  showLockError('');
  document.getElementById('lock-btn').disabled = true;
  try{
    if(lockMode === 'setup'){
      const pass2 = document.getElementById('lock-pass2').value;
      if(!pass || pass.length < 6){ showLockError('Usa al menos 6 caracteres.'); return; }
      if(pass !== pass2){ showLockError('Las contraseñas no coinciden.'); return; }
      const dekBytes = crypto.getRandomValues(new Uint8Array(32));
      cryptoKey = await importDek(dekBytes);
      const passSalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
      const kek1 = await deriveKey(pass, passSalt);
      const passWrappedKey = await wrapBytes(kek1, dekBytes);
      const recoveryCode = generateRecoveryCode();
      const recoverySalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
      const kek2 = await deriveKey(recoveryCode, recoverySalt);
      const recoveryWrappedKey = await wrapBytes(kek2, dekBytes);
      await fsSet('profile', {v:2, passSalt, passWrappedKey, recoverySalt, recoveryWrappedKey});
      showRecoveryScreen(recoveryCode);
    } else if(lockMode === 'unlock'){
      if(!pass){ showLockError('Escribe tu contraseña.'); return; }
      const profile = await fsGet('profile');
      if(profile.v === 2){
        try{
          const kek1 = await deriveKey(pass, profile.passSalt);
          const dekBytes = await unwrapBytes(kek1, profile.passWrappedKey);
          cryptoKey = await importDek(dekBytes);
          unlockApp();
        }catch(e){ showLockError('Contraseña incorrecta.'); }
      } else {
        // Perfil antiguo (sin código de recuperación): verificamos y lo actualizamos al nuevo esquema
        // reutilizando exactamente la misma clave, sin tocar los datos ya cifrados con ella.
        try{
          const oldKey = await deriveKey(pass, profile.salt);
          const check = await decStr(oldKey, profile.check);
          if(check !== 'ok') throw new Error('bad');
          const dekBytes = new Uint8Array(await crypto.subtle.exportKey('raw', oldKey));
          cryptoKey = await importDek(dekBytes);
          const passSalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
          const kek1 = await deriveKey(pass, passSalt);
          const passWrappedKey = await wrapBytes(kek1, dekBytes);
          const recoveryCode = generateRecoveryCode();
          const recoverySalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
          const kek2 = await deriveKey(recoveryCode, recoverySalt);
          const recoveryWrappedKey = await wrapBytes(kek2, dekBytes);
          await fsSet('profile', {v:2, passSalt, passWrappedKey, recoverySalt, recoveryWrappedKey});
          showRecoveryScreen(recoveryCode);
        }catch(e){ showLockError('Contraseña incorrecta.'); }
      }
    } else if(lockMode === 'recover'){
      if(!pass){ showLockError('Escribe tu código de recuperación.'); return; }
      try{
        const profile = await fsGet('profile');
        const kek2 = await deriveKey(normalizeCode(pass), profile.recoverySalt);
        pendingDekBytes = await unwrapBytes(kek2, profile.recoveryWrappedKey);
        showSetNewPasswordScreen();
      }catch(e){ showLockError('Código incorrecto.'); }
    } else if(lockMode === 'setnew'){
      const pass2 = document.getElementById('lock-pass2').value;
      if(!pass || pass.length < 6){ showLockError('Usa al menos 6 caracteres.'); return; }
      if(pass !== pass2){ showLockError('Las contraseñas no coinciden.'); return; }
      const dekBytes = pendingDekBytes;
      cryptoKey = await importDek(dekBytes);
      const passSalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
      const kek1 = await deriveKey(pass, passSalt);
      const passWrappedKey = await wrapBytes(kek1, dekBytes);
      const profile = await fsGet('profile');
      await fsSet('profile', {...profile, passSalt, passWrappedKey});
      pendingDekBytes = null;
      unlockApp();
    }
  } finally {
    document.getElementById('lock-btn').disabled = false;
  }
}

/* ================== CAMBIAR CONTRASEÑA (ya dentro de la app) ================== */
function openChangePassword(){
  document.getElementById('cp-old').value = '';
  document.getElementById('cp-new').value = '';
  document.getElementById('cp-new2').value = '';
  document.getElementById('cp-error').textContent = '';
  document.getElementById('cp-overlay').style.display = 'flex';
}
function closeChangePassword(){
  document.getElementById('cp-overlay').style.display = 'none';
}
async function submitChangePassword(){
  const oldPass = document.getElementById('cp-old').value;
  const newPass = document.getElementById('cp-new').value;
  const newPass2 = document.getElementById('cp-new2').value;
  const errEl = document.getElementById('cp-error');
  errEl.textContent = '';
  if(!oldPass || !newPass){ errEl.textContent = 'Rellena todos los campos.'; return; }
  if(newPass.length < 6){ errEl.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.'; return; }
  if(newPass !== newPass2){ errEl.textContent = 'Las contraseñas nuevas no coinciden.'; return; }
  try{
    const profile = await fsGet('profile');
    const kek1old = await deriveKey(oldPass, profile.passSalt);
    await unwrapBytes(kek1old, profile.passWrappedKey); // lanza error si la contraseña actual está mal
    const dekBytes = new Uint8Array(await crypto.subtle.exportKey('raw', cryptoKey));
    const newSalt = b64FromBytes(crypto.getRandomValues(new Uint8Array(16)));
    const kek1new = await deriveKey(newPass, newSalt);
    const newWrapped = await wrapBytes(kek1new, dekBytes);
    await fsSet('profile', {...profile, passSalt: newSalt, passWrappedKey: newWrapped});
    closeChangePassword();
    alert('Contraseña actualizada correctamente.');
  }catch(e){
    errEl.textContent = 'La contraseña actual no es correcta.';
  }
}

function unlockApp(){
  document.getElementById('lock-overlay').style.display = 'none';
  document.getElementById('app-wrap').style.display = '';
  boot();
}

/* ================== TAREAS (Gestiones) ================== */
let tasks = [];
const SEED_TASKS = [];

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

async function loadTasks(){
  try{
    const data = await fsGet('tasks');
    if(data && data.items){
      tasks = [];
      for(const t of data.items){
        tasks.push({...t, titulo: await decStr(cryptoKey, t.titulo), notas: await decStr(cryptoKey, t.notas)});
      }
    }
    else { tasks = SEED_TASKS.slice(); await saveTasks(); }
  }catch(e){ tasks = SEED_TASKS.slice(); setStatus('Sin conexión — revisa tu configuración de Firebase.'); }
  renderTasks();
}
async function saveTasks(){
  setStatus('Guardando...');
  try{
    const encItems = [];
    for(const t of tasks){
      encItems.push({...t, titulo: await encStr(cryptoKey, t.titulo), notas: await encStr(cryptoKey, t.notas)});
    }
    await fsSet('tasks', {items: encItems});
    setStatus('Guardado ✓');
  }
  catch(e){ setStatus('Error al guardar.'); }
}
function addTask(){
  const titulo = document.querySelector('[name="titulo"]').value.trim();
  if(!titulo) return;
  const categoria = document.querySelector('[name="categoria"]').value;
  const fecha = document.querySelector('[name="fecha"]').value;
  const notas = document.querySelector('[name="notas"]').value.trim();
  tasks.unshift({id: uid(), titulo, categoria, fecha, notas, done:false, created: Date.now()});
  document.querySelector('[name="titulo"]').value = '';
  document.querySelector('[name="notas"]').value = '';
  document.querySelector('[name="fecha"]').value = '';
  saveTasks(); renderTasks();
}
function toggleDone(id){ const t = tasks.find(x=>x.id===id); if(t){ t.done=!t.done; saveTasks(); renderTasks(); } }
function delTask(id){ tasks = tasks.filter(x=>x.id!==id); saveTasks(); renderTasks(); }

function dueBadge(fecha){
  if(!fecha) return '';
  const d = new Date(fecha+'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((d-now)/86400000);
  let cls='b-due-ok', label = d.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
  if(diffDays<0){ cls='b-due-over'; label='Venció '+label; }
  else if(diffDays<=7){ cls='b-due-soon'; label='Vence '+label; }
  else { label='Antes del '+label; }
  return '<span class="badge '+cls+'">'+label+'</span>';
}

function renderTasks(){
  const container = document.getElementById('lists');
  if(tasks.length===0){ container.innerHTML = '<div class="empty">No hay gestiones todavía.</div>'; setStatus(''); return; }
  const pending = tasks.filter(t=>!t.done), done = tasks.filter(t=>t.done);
  function taskHtml(t){
    return '<div class="task '+(t.done?'done':'')+'">'
      + '<input type="checkbox" class="check" '+(t.done?'checked':'')+' onchange="toggleDone(\''+t.id+'\')">'
      + '<div class="t-body"><p class="t-title">'+escapeHtml(t.titulo)+'</p>'
      + (t.notas ? '<p class="t-notes">'+escapeHtml(t.notas)+'</p>' : '')
      + '<div class="t-meta"><span class="badge b-cat">'+escapeHtml(t.categoria)+'</span>'+dueBadge(t.fecha)+'</div></div>'
      + '<button class="del" onclick="delTask(\''+t.id+'\')">✕</button></div>';
  }
  let html = '<div class="group"><h2>Pendientes ('+pending.length+')</h2>';
  html += pending.length ? pending.map(taskHtml).join('') : '<div class="empty">Nada pendiente 🎉</div>';
  html += '</div>';
  if(done.length){ html += '<div class="group"><h2>Hecho ('+done.length+')</h2>' + done.map(taskHtml).join('') + '</div>'; }
  container.innerHTML = html;
  setStatus('');
}

function addService(){

function startEdit(id){ editingServiceId = id; renderServices(); }
function cancelEdit(){ editingServiceId = null; renderServices(); }
function saveEdit(id){
  const s = services.find(x=>x.id===id); if(!s) return;
  s.nombre = document.querySelector('[data-edit="nombre"]').value.trim() || s.nombre;
  s.tipo = document.querySelector('[data-edit="tipo"]').value;
  s.proveedor = document.querySelector('[data-edit="proveedor"]').value.trim();
  s.referencia = document.querySelector('[data-edit="referencia"]').value.trim();
  s.notas = document.querySelector('[data-edit="notas"]').value.trim();

}

function renderServices(){
  const grid = document.getElementById('service-grid');
  if(services.length===0){ grid.innerHTML = '<div class="empty">No hay servicios cargados.</div>'; setStatus(''); return; }
  grid.innerHTML = '<div class="service-grid">' + services.map(s => {
    if(s.id === editingServiceId){
      return '<div class="s-card s-editing">'
        + '<select data-edit="tipo">' + TIPOS.map(t=>'<option value="'+t+'"'+(t===s.tipo?' selected':'')+'>'+t+'</option>').join('') + '</select>'
        + '<input data-edit="nombre" value="'+escapeAttr(s.nombre)+'" placeholder="Servicio">'
        + '<input data-edit="proveedor" value="'+escapeAttr(s.proveedor||'')+'" placeholder="Compañía / proveedor">'
        + '<input data-edit="referencia" value="'+escapeAttr(s.referencia||'')+'" placeholder="N° de póliza / cuenta">'
        + '<input data-edit="notas" value="'+escapeAttr(s.notas||'')+'" placeholder="Notas">'
        + '<div class="s-edit-actions"><button class="btn-add" onclick="saveEdit(\''+s.id+'\')">Guardar</button>'
        + '<button class="btn-cancel" onclick="cancelEdit()">Cancelar</button></div></div>';
    }
    return '<div class="s-card">'
      + '<button class="s-edit" onclick="startEdit(\''+s.id+'\')">Editar</button>'
      + '<span class="s-type">'+escapeHtml(s.tipo)+'</span>'
      + '<p class="s-nombre">'+escapeHtml(s.nombre)+'</p>'
      + (s.proveedor ? '<p class="s-proveedor">'+escapeHtml(s.proveedor)+'</p>' : '')
      + (s.referencia ? '<span class="s-ref">'+escapeHtml(s.referencia)+'</span><br>' : '')
      + (s.notas ? '<p class="s-notas">'+escapeHtml(s.notas)+'</p>' : '')
      + (s.id === 'sv-seed1' ? '<button class="s-pdf" onclick="openStoredPdf()">📄 Ver documento PDF</button>' : '')
      + '</div>';
  }).join('') + '</div>';
  setStatus('');
}
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ================== PDF (guardado como base64 en Firestore) ================== */
const PDF_FILENAME = 'Comprehensive_OSHC_Cover_Summary.pdf';
// El PDF real ya vive cifrado en Firestore (doc "pdf"); no se guarda aquí para no exponerlo en el repo público.
let PDF_B64 = '';

async function ensurePdfStored(){
  try{
    const data = await fsGet('pdf');
    if(!data || !data.b64){
      if(PDF_B64){ await fsSet('pdf', {b64: await encStr(cryptoKey, PDF_B64), filename: PDF_FILENAME}); }
    }
  }catch(e){}
}
function b64toBlob(b64Data, contentType){
  const byteChars = atob(b64Data);
  const byteArrays = [];
  for(let offset=0; offset<byteChars.length; offset+=1024){
    const slice = byteChars.slice(offset, offset+1024);
    const byteNumbers = new Array(slice.length);
    for(let i=0;i<slice.length;i++){ byteNumbers[i] = slice.charCodeAt(i); }
    byteArrays.push(new Uint8Array(byteNumbers));
  }
  return new Blob(byteArrays, {type: contentType});
}
async function openStoredPdf(){
  try{
    const data = await fsGet('pdf');
    const b64 = (data && data.b64) ? await decStr(cryptoKey, data.b64) : PDF_B64;
    if(!b64){ alert('El PDF todavía no está cargado.'); return; }
    const blob = b64toBlob(b64, 'application/pdf');
    window.open(URL.createObjectURL(blob), '_blank');
  }catch(e){ alert('No se pudo abrir el PDF.'); }
}
