<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6E6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mis cosas — Brisbane</title>
<style>
  :root{
    --bg: #F5F6F1;
    --card: #FFFFFF;
    --ink: #1F2A24;
    --ink-soft: #5B665D;
    --line: #DCDFD5;
    --river: #2E6E6E;
    --river-soft: #E4EEEC;
    --jacaranda: #7C6A9C;
    --jacaranda-soft: #EFEBF4;
    --rust: #B5542D;
    --rust-soft: #F6E7E0;
    --amber: #A8790F;
    --amber-soft: #F5EEDD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{margin-bottom:22px;}
  h1{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header p{margin:0;color:var(--ink-soft);font-size:0.92rem;}

  .add-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:24px;
  }
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
  .add-row:last-child{margin-bottom:0;}
  input, select{
    font-family:inherit;
    font-size:0.92rem;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#FAFAF7;
    color:var(--ink);
  }
  input[name="titulo"]{flex:1 1 220px;}
  input[type="date"]{flex:0 0 150px;}
  select{flex:0 0 150px;}
  input[name="notas"]{flex:1 1 100%;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:8px 14px;
    font-size:0.88rem;
    font-weight:600;
  }
  .btn-add{background:var(--river);color:white;flex:0 0 auto;}
  .btn-add:hover{background:#255a5a;}

  .group{margin-bottom:22px;}
  .group h2{
    font-size:0.78rem;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  .task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    margin-bottom:8px;
  }
  .task.done{opacity:0.55;}
  .task.done .t-title{text-decoration:line-through;}
  .check{
    margin-top:2px;
    width:18px;height:18px;
    accent-color:var(--river);
    flex:0 0 auto;
    cursor:pointer;
  }
  .t-body{flex:1;min-width:0;}
  .t-title{font-size:0.95rem;font-weight:600;margin:0;}
  .t-notes{font-size:0.83rem;color:var(--ink-soft);margin:2px 0 0;}
  .t-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .badge{
    font-size:0.72rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
  }
  .b-cat{background:var(--jacaranda-soft);color:var(--jacaranda);}
  .b-due-ok{background:var(--river-soft);color:var(--river);}
  .b-due-soon{background:var(--amber-soft);color:var(--amber);}
  .b-due-over{background:var(--rust-soft);color:var(--rust);}
  .del{background:transparent;color:var(--ink-soft);font-size:1rem;padding:2px 6px;flex:0 0 auto;}
  .del:hover{color:var(--rust);}
  .empty{color:var(--ink-soft);font-size:0.9rem;padding:16px 0;text-align:center;}
  .status{font-size:0.78rem;color:var(--ink-soft);text-align:center;margin-top:18px;}

  .tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab{background:transparent;border:none;border-radius:0;padding:9px 4px;margin-right:14px;font-size:0.92rem;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .tab.active{color:var(--river);border-bottom:2px solid var(--river);}

  .service-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  @media(max-width:480px){ .service-grid{grid-template-columns:1fr;} }
  .s-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 13px;position:relative;}
  .s-type{display:inline-block;font-size:0.68rem;font-weight:700;color:var(--jacaranda);background:var(--jacaranda-soft);padding:2px 8px;border-radius:20px;margin-bottom:6px;}
  .s-nombre{font-size:0.98rem;font-weight:700;margin:0 0 1px;}
  .s-proveedor{font-size:0.85rem;color:var(--ink-soft);margin:0 0 6px;}
  .s-ref{font-size:0.85rem;font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;background:#FAFAF7;border:1px solid var(--line);border-radius:6px;padding:4px 7px;display:inline-block;margin-bottom:4px;}
  .s-notas{font-size:0.8rem;color:var(--ink-soft);margin:4px 0 0;white-space:pre-line;}
  .s-edit{position:absolute;top:8px;right:8px;background:transparent;color:var(--river);font-size:0.76rem;font-weight:700;padding:2px 5px;}
  .s-edit:hover{text-decoration:underline;}
  .s-editing{display:flex;flex-direction:column;gap:6px;}
  .s-editing input, .s-editing select{width:100%;font-size:0.85rem;padding:6px 8px;}
  .s-edit-actions{display:flex;gap:6px;margin-top:2px;}
  .s-edit-actions .btn-add{flex:1;padding:6px 10px;font-size:0.82rem;}
  .btn-cancel{background:transparent;color:var(--ink-soft);border:1px solid var(--line);flex:1;padding:6px 10px;font-size:0.82rem;}
  .s-pdf{display:block;margin-top:8px;background:var(--river-soft);color:var(--river);font-size:0.78rem;font-weight:700;padding:6px 10px;border-radius:7px;width:100%;}
  .s-pdf:hover{background:var(--river);color:white;}
  .sugg-title{font-size:0.78rem;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mis cosas — Brisbane</h1>
    <p>Tus servicios clave y trámites de la mudanza, en un solo lugar.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-servicios" onclick="showPanel('servicios')">Mis servicios</button>
    <button class="tab" id="tab-gestiones" onclick="showPanel('gestiones')">Gestiones</button>
  </div>

  <div id="panel-servicios">
    <div class="add-box">
      <div class="add-row">
        <input name="s-nombre" placeholder="Servicio (ej: Seguro médico, Teléfono)">
        <select name="s-tipo">
          <option value="Salud">Salud</option>
          <option value="Teléfono">Teléfono</option>
          <option value="Internet">Internet</option>
          <option value="Banco">Banco</option>
          <option value="Electricidad">Electricidad</option>
          <option value="Gas">Gas</option>
          <option value="Agua">Agua</option>
          <option value="Educación">Educación</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="add-row">
        <input name="s-proveedor" placeholder="Compañía / proveedor">
        <input name="s-referencia" placeholder="N° de póliza / cuenta / socio">
      </div>
      <div class="add-row">
        <input name="s-notas" placeholder="Notas (opcional)">
        <button class="btn-add" onclick="addService()">Agregar</button>
      </div>
    </div>
    <div id="service-grid"></div>
  </div>

  <div id="panel-gestiones" style="display:none;">
    <div class="add-box">
      <div class="add-row">
        <input name="titulo" placeholder="Nueva gestión">
        <select name="categoria">
          <option value="Salud">Salud</option>
          <option value="Gobierno">Gobierno</option>
          <option value="Hogar">Hogar</option>
          <option value="Finanzas">Finanzas</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="add-row">
        <input type="date" name="fecha">
        <input name="notas" placeholder="Notas (opcional)">
        <button class="btn-add" onclick="addTask()">Agregar</button>
      </div>
    </div>
    <div id="lists"></div>
  </div>

  <div class="status" id="status">Conectando...</div>
</div>

<!-- Firebase (compat SDK, simple script-tag usage) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================================
   1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
   La obtienes en: Firebase Console > Configuración del proyecto > Tus apps > Config
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBWz0EQ4NIYd0h-SBlAO4caDWAF_Haq9v4",
  authDomain: "brisbane-fc39b.firebaseapp.com",
  projectId: "brisbane-fc39b",
  storageBucket: "brisbane-fc39b.firebasestorage.app",
  messagingSenderId: "86322096365",
  appId: "1:86322096365:web:3b4368e66bbdc7ee59c4e4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = 'misCosas'; // no cambies esto salvo que sepas lo que haces

async function fsGet(docName){
  const snap = await db.collection(COLLECTION).doc(docName).get();
  return snap.exists ? snap.data() : null;
}
async function fsSet(docName, data){
  await db.collection(COLLECTION).doc(docName).set(data);
}

function setStatus(msg){ document.getElementById('status').textContent = msg; }

/* ================== TAREAS (Gestiones) ================== */
let tasks = [];
const SEED_TASKS = [
  { id:'seed1', titulo:'Actualizar dirección en Medicare', categoria:'Salud', fecha:'', notas:'Vía myGov → Medicare → Mis detalles → Editar dirección.', done:false, created: Date.now() }
];

function uid(){ return 't' + Date.now() + Math.random().toString(36).slice(2,7); }

async function loadTasks(){
  try{
    const data = await fsGet('tasks');
    if(data && data.items){ tasks = data.items; }
    else { tasks = SEED_TASKS.slice(); await fsSet('tasks', {items: tasks}); }
  }catch(e){ tasks = SEED_TASKS.slice(); setStatus('Sin conexión — revisa tu configuración de Firebase.'); }
  renderTasks();
}
async function saveTasks(){
  setStatus('Guardando...');
  try{ await fsSet('tasks', {items: tasks}); setStatus('Guardado ✓'); }
  catch(e){ setStatus('Error al guardar.'); }
}
function addTask(){
  const titulo = document.querySelector('[name="titulo"]').value.trim();
  if(!titulo) return;
  const categoria = document.querySelector('[name="categoria"]').value;
  const fecha = document.querySelector('[name="fecha"]').value;
  const notas = document.querySelector('[name="notas"]').value.trim();
  tasks.unshift({id: uid(), titulo, categoria, fecha, notas, done:false, created: Date.now()});
  document.querySelector('[name="titulo"]').value = '';
  document.querySelector('[name="notas"]').value = '';
  document.querySelector('[name="fecha"]').value = '';
  saveTasks(); renderTasks();
}
function toggleDone(id){ const t = tasks.find(x=>x.id===id); if(t){ t.done=!t.done; saveTasks(); renderTasks(); } }
function delTask(id){ tasks = tasks.filter(x=>x.id!==id); saveTasks(); renderTasks(); }

function dueBadge(fecha){
  if(!fecha) return '';
  const d = new Date(fecha+'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  const diffDays = Math.round((d-now)/86400000);
  let cls='b-due-ok', label = d.toLocaleDateString('es-ES', {day:'numeric', month:'short'});
  if(diffDays<0){ cls='b-due-over'; label='Venció '+label; }
  else if(diffDays<=7){ cls='b-due-soon'; label='Vence '+label; }
  else { label='Antes del '+label; }
  return '<span class="badge '+cls+'">'+label+'</span>';
}

function renderTasks(){
  const container = document.getElementById('lists');
  if(tasks.length===0){ container.innerHTML = '<div class="empty">No hay gestiones todavía.</div>'; setStatus(''); return; }
  const pending = tasks.filter(t=>!t.done), done = tasks.filter(t=>t.done);
  function taskHtml(t){
    return '<div class="task '+(t.done?'done':'')+'">'
      + '<input type="checkbox" class="check" '+(t.done?'checked':'')+' onchange="toggleDone(\''+t.id+'\')">'
      + '<div class="t-body"><p class="t-title">'+escapeHtml(t.titulo)+'</p>'
      + (t.notas ? '<p class="t-notes">'+escapeHtml(t.notas)+'</p>' : '')
      + '<div class="t-meta"><span class="badge b-cat">'+escapeHtml(t.categoria)+'</span>'+dueBadge(t.fecha)+'</div></div>'
      + '<button class="del" onclick="delTask(\''+t.id+'\')">✕</button></div>';
  }
  let html = '<div class="group"><h2>Pendientes ('+pending.length+')</h2>';
  html += pending.length ? pending.map(taskHtml).join('') : '<div class="empty">Nada pendiente 🎉</div>';
  html += '</div>';
  if(done.length){ html += '<div class="group"><h2>Hecho ('+done.length+')</h2>' + done.map(taskHtml).join('') + '</div>'; }
  container.innerHTML = html;
  setStatus('');
}

/* ================== SERVICIOS ================== */
let services = [];
let editingServiceId = null;
const TIPOS = ['Salud','Teléfono','Internet','Banco','Electricidad','Gas','Agua','Educación','Otro'];
const SEED_SERVICES = [
  { id:'sv-seed1', nombre:'Seguro médico', tipo:'Salud', proveedor:'Medibank', referencia:'83583520', notas:'Essential OSHC · Cobertura: Single · Afiliado desde 10/09/2026', created: Date.now() },
  { id:'sv-tel1', nombre:'Teléfono', tipo:'Teléfono', proveedor:'Lebara', referencia:'+61 406 771 547', notas:'', created: Date.now() },
  { id:'sv-school1', nombre:'Escuela de inglés — UFO English', tipo:'Educación', proveedor:'UFO English School', referencia:'N° estudiante: 50249', notas:'Dirección: Ground Floor, 343 Albert Street, Brisbane, 4000 · Curso 1: UFO English Full Time (103310G), 14 Sep 2026 – 11 Dic 2026 · Curso 2: CAE Flexi, 08 Feb 2027 – 07 May 2027', created: Date.now() },
  { id:'sv-personal1', nombre:'Datos personales', tipo:'Otro', proveedor:'', referencia:'', notas:'Nombre completo: Jose Antonio Reyes Lecuona · Nacimiento: 25 Jun 2003 (22 años) · Nacionalidad: España', created: Date.now() },
  { id:'sv-coles1', nombre:'Cuenta Coles (supermercado)', tipo:'Otro', proveedor:'Coles', referencia:'', notas:'Contraseña: Supermercado en Español', created: Date.now() }
];

function suid(){ return 's' + Date.now() + Math.random().toString(36).slice(2,7); }

async function loadServices(){
  try{
    const data = await fsGet('services');
    if(data && data.items){ services = data.items; }
    else { services = SEED_SERVICES.slice(); await fsSet('services', {items: services}); }
  }catch(e){ services = SEED_SERVICES.slice(); }
  renderServices();
}
async function saveServices(){
  setStatus('Guardando...');
  try{ await fsSet('services', {items: services}); setStatus('Guardado ✓'); }
  catch(e){ setStatus('Error al guardar.'); }
}
function addService(){
  const nombre = document.querySelector('[name="s-nombre"]').value.trim();
  if(!nombre) return;
  const tipo = document.querySelector('[name="s-tipo"]').value;
  const proveedor = document.querySelector('[name="s-proveedor"]').value.trim();
  const referencia = document.querySelector('[name="s-referencia"]').value.trim();
  const notas = document.querySelector('[name="s-notas"]').value.trim();
  services.unshift({id: suid(), nombre, tipo, proveedor, referencia, notas, created: Date.now()});
  ['s-nombre','s-proveedor','s-referencia','s-notas'].forEach(n => document.querySelector('[name="'+n+'"]').value = '');
  saveServices(); renderServices();
}
function startEdit(id){ editingServiceId = id; renderServices(); }
function cancelEdit(){ editingServiceId = null; renderServices(); }
function saveEdit(id){
  const s = services.find(x=>x.id===id); if(!s) return;
  s.nombre = document.querySelector('[data-edit="nombre"]').value.trim() || s.nombre;
  s.tipo = document.querySelector('[data-edit="tipo"]').value;
  s.proveedor = document.querySelector('[data-edit="proveedor"]').value.trim();
  s.referencia = document.querySelector('[data-edit="referencia"]').value.trim();
  s.notas = document.querySelector('[data-edit="notas"]').value.trim();
  editingServiceId = null; saveServices(); renderServices();
}

function renderServices(){
  const grid = document.getElementById('service-grid');
  if(services.length===0){ grid.innerHTML = '<div class="empty">No hay servicios cargados.</div>'; setStatus(''); return; }
  grid.innerHTML = '<div class="service-grid">' + services.map(s => {
    if(s.id === editingServiceId){
      return '<div class="s-card s-editing">'
        + '<select data-edit="tipo">' + TIPOS.map(t=>'<option value="'+t+'"'+(t===s.tipo?' selected':'')+'>'+t+'</option>').join('') + '</select>'
        + '<input data-edit="nombre" value="'+escapeAttr(s.nombre)+'" placeholder="Servicio">'
        + '<input data-edit="proveedor" value="'+escapeAttr(s.proveedor||'')+'" placeholder="Compañía / proveedor">'
        + '<input data-edit="referencia" value="'+escapeAttr(s.referencia||'')+'" placeholder="N° de póliza / cuenta">'
        + '<input data-edit="notas" value="'+escapeAttr(s.notas||'')+'" placeholder="Notas">'
        + '<div class="s-edit-actions"><button class="btn-add" onclick="saveEdit(\''+s.id+'\')">Guardar</button>'
        + '<button class="btn-cancel" onclick="cancelEdit()">Cancelar</button></div></div>';
    }
    return '<div class="s-card">'
      + '<button class="s-edit" onclick="startEdit(\''+s.id+'\')">Editar</button>'
      + '<span class="s-type">'+escapeHtml(s.tipo)+'</span>'
      + '<p class="s-nombre">'+escapeHtml(s.nombre)+'</p>'
      + (s.proveedor ? '<p class="s-proveedor">'+escapeHtml(s.proveedor)+'</p>' : '')
      + (s.referencia ? '<span class="s-ref">'+escapeHtml(s.referencia)+'</span><br>' : '')
      + (s.notas ? '<p class="s-notas">'+escapeHtml(s.notas)+'</p>' : '')
      + (s.id === 'sv-seed1' ? '<button class="s-pdf" onclick="openStoredPdf()">📄 Ver documento PDF</button>' : '')
      + '</div>';
  }).join('') + '</div>';
  setStatus('');
}
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ================== PDF (guardado como base64 en Firestore) ================== */
const PDF_FILENAME = 'Comprehensive_OSHC_Cover_Summary.pdf';
// PDF_B64 se rellena más abajo (ver bloque separado) para no inflar este archivo visualmente.
let PDF_B64 = '';

async function ensurePdfStored(){
  try{
    const data = await fsGet('pdf');
    if(!data || !data.b64){
      if(PDF_B64){ await fsSet('pdf', {b64: PDF_B64, filename: PDF_FILENAME}); }
    }
  }catch(e){}
}
function b64toBlob(b64Data, contentType){
  const byteChars = atob(b64Data);
  const byteArrays = [];
  for(let offset=0; offset<byteChars.length; offset+=1024){
    const slice = byteChars.slice(offset, offset+1024);
    const byteNumbers = new Array(slice.length);
    for(let i=0;i<slice.length;i++){ byteNumbers[i] = slice.charCodeAt(i); }
    byteArrays.push(new Uint8Array(byteNumbers));
  }
  return new Blob(byteArrays, {type: contentType});
}
async function openStoredPdf(){
  try{
    const data = await fsGet('pdf');
    const b64 = (data && data.b64) ? data.b64 : PDF_B64;
    if(!b64){ alert('El PDF todavía no está cargado.'); return; }
    const blob = b64toBlob(b64, 'application/pdf');
    window.open(URL.createObjectURL(blob), '_blank');
  }catch(e){ alert('No se pudo abrir el PDF.'); }
}

/* ================== Tabs & init ================== */
function showPanel(which){
  const isServ = which === 'servicios';
  document.getElementById('panel-servicios').style.display = isServ ? '' : 'none';
  document.getElementById('panel-gestiones').style.display = isServ ? 'none' : '';
  document.getElementById('tab-servicios').classList.toggle('active', isServ);
  document.getElementById('tab-gestiones').classList.toggle('active', !isServ);
}

loadTasks();
loadServices();
ensurePdfStored();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
